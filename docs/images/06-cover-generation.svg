 fill="#F4F7FB" height="47.9375" rx="4" ry="4" style="stroke:#33475B;stroke-width:0.5;" width="240.3535" x="60.6025" y="1012.1768"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="133.3945" x="70.6025" y="1033.3154">served from /media/...</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="220.3535" x="70.6025" y="1047.2842">via nginx, Cache-Control: immutable</text><path d="M211.7793,1070.1143 L211.7793,1146.7783 L191.7793,1150.7783 L211.7793,1154.7783 L211.7793,1231.4424 A0,0 0 0 0 211.7793,1231.4424 L500.1045,1231.4424 A0,0 0 0 0 500.1045,1231.4424 L500.1045,1080.1143 L490.1045,1070.1143 L211.7793,1070.1143 A0,0 0 0 0 211.7793,1070.1143" fill="#FBEFD5" style="stroke:#A9822C;stroke-width:0.5;"/><path d="M490.1045,1070.1143 L490.1045,1080.1143 L500.1045,1080.1143 L490.1045,1070.1143" fill="#FBEFD5" style="stroke:#A9822C;stroke-width:0.5;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="209.7075" x="217.7793" y="1087.1812">Regenerated on publish() only if</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="267.3252" x="217.7793" y="1102.314">{hue, contentHash, styleVersion} drifted</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="264.9639" x="217.7793" y="1117.4468">from the last save &#8212; never on autosave,</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="207.0732" x="217.7793" y="1132.5796">same draft/publish boundary as</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="170.1235" x="217.7793" y="1147.7124">05-content-lifecycle.puml.</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="217.7793" y="1162.8452">&#160;</text><text fill="#000000" font-family=
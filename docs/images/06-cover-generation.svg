xtLength="177.6621" x="66.8643" y="209.4717">resolveIdentityHue(kind, key)</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="227.8301" x="66.8643" y="223.4404">&#8212; van der Corput, base-2 assignment</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="196.6348" x="66.8643" y="237.4092">over ONE shared ordinal pool for</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="180.0234" x="66.8643" y="251.3779">categories AND Work projects</text><rect fill="#F4F7FB" height="61.9063" rx="4" ry="4" style="stroke:#33475B;stroke-width:0.5;" width="296.1465" x="32.7061" y="284.208"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="276.1465" x="42.7061" y="305.3467">seed = `${slug}:${styleVersion}:${variant}`</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="150.7148" x="42.7061" y="319.3154">&#8594; cyrb128 &#8594; sfc32 PRNG</text><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="171.4922" x="42.7061" y="333.2842">(no Math.random anywhere)</text><rect fill="#FAFAFA" height="435.9219" rx="4" ry="4" style="stroke:#808080;stroke-width:1.5;" width="329.5586" x="16" y="368.1143"/><path d="M275.3613,368.1143 L275.3613,377.4111 L265.3613,387.4111 L16,387.4111" fill="none" style="stroke:#808080;stroke-width:1.5;"/><text fill="#33475B" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="249.3613" x="19" y="382.1094">Composition (cover-composition.ts)</text><rect fill="#F4F7FB" height="47.9375" rx="4" ry="4" style="stroke:#33475B;stroke-width:0.5;" width="268.918" x="46.3203" y="404.4111"/><text fill="#000000" font-family="'Segoe UI'" font-size="12" lengthAdjust="spacing" textLength="114.1289" x="56.3203" y="425.5498">OKLCH mesh spots</text><text fill="#000000" font-famil
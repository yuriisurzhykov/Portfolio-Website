<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="861px" preserveAspectRatio="none" style="width:1510px;height:861px;background:#FFFFFF;" version="1.1" viewBox="0 0 1510 861" width="1510px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="Draft" data-source-line="12" id="ent0001"><rect fill="#F4F7FB" height="50" rx="12.5" ry="12.5" style="stroke:#33475B;stroke-width:0.5;" width="66.6895" x="600.96" y="234.07"/><line style="stroke:#33475B;stroke-width:0.5;" x1="600.96" x2="667.6495" y1="260.3669" y2="260.3669"/><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="46.6895" x="610.96" y="252.0651">DRAFT</text></g><g class="entity" data-qualified-name="Published" data-source-line="13" id="ent0002"><rect fill="#F4F7FB" height="50" rx="12.5" ry="12.5" style="stroke:#33475B;stroke-width:0.5;" width="99.2627" x="547.67" y="532.39"/><line style="stroke:#33475B;stroke-width:0.5;" x1="547.67" x2="646.9327" y1="558.6869" y2="558.6869"/><text fill="#000000" font-family="'Segoe UI'" font-size="14" lengthAdjust="spacing" textLength="79.2627" x="557.67" y="550.3851">PUBLISHED</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="15" id="ent0003"><ellipse cx="634.3" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="25" id="ent0009"><ellipse cx="818.3" cy="757.89" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="818.3" cy="757.89" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN12" data-source-line="29" id="ent0013"><path d="M984.93,133 L984.93,255.07 L668.04,259.07 L984.93,263.07 L984.93,385.125 A0,0 0 0 0 984.93,385.125 L1495.6707,385.125 A0,0 0 0 0 1495.6707,385.125 L1495.6707,143 L1485.6707,133 L984.93,133 A0,0 0 0 0 984.93,133" fill="#FBEFD5" style="stroke:#A9822C;stroke-width:0.5;"/><path d="M1485.6707,133 L1485.6707,143 L1495.6707,143 L1485.6707,133" fill="#FBEFD5" style="stroke:#A9822C;stroke-width:0.5;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="125.8232" x="990.93" y="150.0669">Document blocks</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="282.8896" x="1120.8856" y="150.0669">(Document &#8594; Block[], order = array index):</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="438.3818" x="990.93" y="165.1997">lead &#183; heading(H2/H3) &#183; paragraph &#183; quote(+attribution) &#183; note(info|</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="441.2954" x="990.93" y="180.3325">warning|tip) &#183; image &#183; code(language+filename) &#183; approachList &#183; list</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="440.0513" x="990.93" y="195.4653">(nested, ordered/unordered) &#183; diagram(engine: mermaid|plantuml).</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="990.93" y="210.5981">&#160;</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="191.5469" x="990.93" y="225.731">Parsing pasted markdown</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="260.1904" x="1186.6092" y="225.731">(paste-handler.ts, a custom splitter that</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="335.4673" x="990.93" y="240.8638">runs BEFORE handing the remainder to BlockNote):</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="398.3472" x="990.93" y="255.9966">&#8226; ```lang ... ```              &#8594; a code block (or diagram, if lang is</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="125.6328" x="1131.429" y="271.1294">mermaid/plantuml)</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="429.2285" x="990.93" y="286.2622">&#8226; consecutive "&gt; " lines       &#8594; one quote block (markers stripped)</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="450.2266" x="990.93" y="301.395">&#8226; everything else              &#8594; editor.pasteMarkdown() from BlockNote:</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="253.8428" x="1131.429" y="316.5278">## / ### &#8594; heading, **/*/`code`/links</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="202.1411" x="1131.429" y="331.6606">&#8594; inline formatting, -/*/1. &#8594; list</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="464.7627" x="990.93" y="346.7935">The lead, note, image and approachList blocks can only be inserted via</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="489.7407" x="990.93" y="361.9263">the slash menu &#8212; pasting markdown can't produce them, because none of</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="317.3701" x="990.93" y="377.0591">them has an unambiguous plain-text equivalent.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="48" id="ent0016"><path d="M15.86,522.13 L15.86,592.6613 L512.7501,592.6613 L512.7501,532.13 L502.7501,522.13 L15.86,522.13" fill="#FBEFD5" style="stroke:#A9822C;stroke-width:0.5;"/><path d="M502.7501,522.13 L502.7501,532.13 L512.7501,532.13 L502.7501,522.13" fill="#FBEFD5" style="stroke:#A9822C;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="475.8901" x="21.86" y="539.1969">publishedAt is set EXACTLY ONCE, on the first transition into PUBLISHED,</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="439.7656" x="21.86" y="554.3297">and is never cleared by Unpublish &#8212; it answers "when was this last</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="434.3257" x="21.86" y="569.4625">published," not "is this published right now" (that's lifecycleState's</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="29.0215" x="21.86" y="584.5953">job).</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="55" id="ent0019"><path d="M6,669.66 L6,846.1209 L522.606,846.1209 L522.606,679.66 L512.606,669.66 L6,669.66" fill="#FBEFD5" style="stroke:#A9822C;stroke-width:0.5;"/><path d="M512.606,669.66 L512.606,679.66 L522.606,679.66 L512.606,669.66" fill="#FBEFD5" style="stroke:#A9822C;stroke-width:1;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="369.3765" x="12" y="686.7269">There is no scheduled auto-publish in this project.</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="102.3115" x="385.5088" y="686.7269">No scheduledAt</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="470.7104" x="12" y="701.8597">field, no cron job, no background worker that would move a record from</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="486.0845" x="12" y="716.9925">DRAFT to PUBLISHED on its own &#8212; none of that exists. The only automatic</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="401.394" x="12" y="732.1253">transition in this state machine actually points the other way:</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="495.606" x="12" y="747.2581">PUBLISHED &#8594; DRAFT, whenever a subsequent autosave stops satisfying the</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="455.4063" x="12" y="762.391">strict publish requirements (say, a required field got cleared out of an</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="437.6963" x="12" y="777.5238">already-published draft). This is a deliberate architectural decision,</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="452.0928" x="12" y="792.6566">not a forgotten feature: the only cron job that genuinely exists in this</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="270.9434" x="12" y="807.7894">repository is the nightly pg_dump backup</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="430.6694" x="12" y="822.9222">(.scripts/provision/11-pg-backup.sh), which has nothing to do with</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="125.1187" x="12" y="838.055">content publishing.</text></g><!--link *start* to Draft--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" data-link-type="dependency" data-source-line="15" id="lnk4"><path d="M634.3,26.45 C634.3,61.1 634.3,176.84 634.3,228.88" fill="none" id="*start*-to-Draft" style="stroke:#33475B;stroke-width:1;"/><polygon fill="#33475B" points="634.3,233.88,638.3,224.88,634.3,228.88,630.3,224.88,634.3,233.88" style="stroke:#33475B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="177.3789" x="655.7744" y="69.0669">createPost() / createWork()</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="218.3276" x="635.3" y="84.1997">(lifecycleState defaults to DRAFT,</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="201.8936" x="643.517" y="99.3325">date/slug are set exactly once)</text></g><!--link Draft to Draft--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" data-link-type="dependency" data-source-line="17" id="lnk5"><path d="M654.59,233.81 C677.02,216.98 702.65,225.4 702.65,259.07 C702.65,292.73 681.0194,304.1509 658.5894,287.3209" fill="none" id="Draft-to-Draft" style="stroke:#33475B;stroke-width:1;"/><polygon fill="#33475B" points="654.59,284.32,659.3882,292.921,658.5894,287.3209,664.1895,286.5221,654.59,284.32" style="stroke:#33475B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="59.687" x="804.8392" y="241.1369">autosave</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="221.6348" x="723.8653" y="256.2697">(3-minute debounce OR field blur;</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="252.0654" x="708.65" y="271.4025">PUT &#8212; replaces the ENTIRE document,</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="95.2783" x="787.0436" y="286.5353">never a patch)</text></g><!--link Draft to Published--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="19" id="lnk6"><path d="M600.65,260.46 C517.56,263.47 302.79,284.16 211.3,415.13 C191.71,443.18 188.26,466.82 211.3,492.13 C259.24,544.78 461.94,502.23 530.3,522.13 C538.71,524.57 542.7831,525.9457 550.8931,529.7957" fill="none" id="Draft-to-Published" style="stroke:#33475B;stroke-width:1;"/><polygon fill="#33475B" points="555.41,531.94,548.995,524.4668,550.8931,529.7957,545.5642,531.6938,555.41,531.94" style="stroke:#33475B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="46.5664" x="331.3725" y="428.1969">Publish</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="145.4883" x="281.9116" y="443.3297">(explicit admin action:</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="191.1914" x="259.06" y="458.4625">flush() &#8594; strict Zod validation</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="284.7114" x="212.3" y="473.5953">of the DB row &#8594; lifecycleState=PUBLISHED,</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="196.9995" x="256.156" y="488.7281">publishedAt set if not already)</text></g><!--link Published to Draft--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" data-link-type="dependency" data-source-line="21" id="lnk7"><path d="M566.39,532.17 C554.97,521.3 543.35,507.46 537.3,492.13 C524.75,460.29 527.86,448.02 537.3,415.13 C551.98,364 585.7878,317.2566 609.6178,288.3766" fill="none" id="Published-to-Draft" style="stroke:#33475B;stroke-width:1;"/><polygon fill="#33475B" points="612.8,284.52,603.9867,288.9161,609.6178,288.3766,610.1573,294.0077,612.8,284.52" style="stroke:#33475B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="64.7334" x="579.0234" y="450.6969">Unpublish</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="146.1802" x="538.3" y="465.8297">(explicit admin action)</text></g><!--link Published to Draft--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" data-link-type="dependency" data-source-line="23" id="lnk8"><path d="M647.15,533.74 C663.65,523.53 680.12,509.75 689.3,492.13 C725.67,422.37 680.39,332.5824 653.27,288.7324" fill="none" id="Published-to-Draft-1" style="stroke:#33475B;stroke-width:1;"/><polygon fill="#33475B" points="650.64,284.48,651.9721,294.2384,653.27,288.7324,658.7759,290.0304,650.64,284.48" style="stroke:#33475B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="99.2393" x="744.0694" y="435.6969">a save stopped</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="176.376" x="705.5011" y="450.8297">satisfying the strict publish</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="146.0723" x="720.6529" y="465.9625">schema (an automatic</text><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="180.5781" x="703.4" y="481.0953">"safety net", not a publish!)</text></g><!--link Draft to *end*--><g class="link" data-entity-1="ent0001" data-entity-2="ent0009" data-link-type="dependency" data-source-line="25" id="lnk10"><path d="M668.08,268.7 C726.22,285.61 843.67,329.16 892.3,415.13 C959.56,534.02 854.222,703.7721 827.042,744.1521" fill="none" id="Draft-to-*end*" style="stroke:#33475B;stroke-width:1;"/><polygon fill="#33475B" points="824.25,748.3,832.5938,743.0674,827.042,744.1521,825.9572,738.6002,824.25,748.3" style="stroke:#33475B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="42.7134" x="914.23" y="561.9569">Delete</text></g><!--link Published to *end*--><g class="link" data-entity-1="ent0002" data-entity-2="ent0009" data-link-type="dependency" data-source-line="26" id="lnk11"><path d="M624.4,582.73 C674.89,628.08 777.1803,719.9487 806.7703,746.5287" fill="none" id="Published-to-*end*" style="stroke:#33475B;stroke-width:1;"/><polygon fill="#33475B" points="810.49,749.87,806.4676,740.88,806.7703,746.5287,801.1216,746.8314,810.49,749.87" style="stroke:#33475B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'Segoe UI'" font-size="13" lengthAdjust="spacing" textLength="42.7134" x="682.51" y="635.7269">Delete</text></g><!--link GMN15 to Published--><g class="link" data-entity-1="ent0016" data-entity-2="ent0002" data-link-type="association" data-source-line="48" id="lnk17"><path d="M513.08,557.39 C524.48,557.39 535.89,557.39 547.29,557.39" fill="none" id="GMN15-Published" style="stroke:#33475B;stroke-width:1;stroke-dasharray:7,7;"/></g><!--link GMN15 to GMN18--><g class="link" data-entity-1="ent0016" data-entity-2="ent0019" data-link-type="association" data-source-line="55" id="lnk20"><path d="M264.3,592.97 C264.3,614.18 264.3,642.38 264.3,669.4" fill="none" id="GMN15-GMN18" style="stroke:#33475B;stroke-width:1;stroke-dasharray:7,7;"/></g><?plantuml-src ZLTBRXj74Dtp51Lg8L8cXx5bmua21z27YWquic19-Lb6r9pfcMbhfdlS7r44lF0g1mXoWbmY-np59ychdY55sZ5WmP38_bHNlNhrghnDPoROL9B9oTlWIygDfSoaRg9gKKWt-VhHE3NQI-t7bSfbkaWhcRYRWZwy_ukiBAIMLdYPqMpHswQaKBuCiydSsEkyCdCtiL9dqeup9GehQfSiwYgXQQOy-L8vobKbHwJbZRHOa7Jsqmz9prqhtGWSfvb8hmjhWiuEJGNFvgNoSctVbI8pSwKBoaNbrdUEP2v2vO_X-uce9VNFP64aNJphhnqwyt3zuACtjeuV7Zy-FlZacB48f3kok_lmyQFr8_lMclddDa_C_xroC3q-UlJngVL7zh_zvi63mrxFyVFKFtgvVtpU9-7eo8hSBvTFBmwUFpjxEZsAMwTXLYbNogpNUxNpciRZxzlJj4UfbRXmQfmV36dIVVqPYHeCB_LWbTmOB6KjV8wyeVZmw59ds9YuAXGah2GdFSbRaVfgGKQdSjZhjI-jloc2DqxSI3omEwwL3j7q3320SozU8lso0dMgOB-xrASNvnshcagaqaL2J4_EdxsSCYL33HB2ZPOiWXhXqtBZrLNmUBdxZ8VbRLEf58GJ6JmWUAoCthlKUHLS2IW-_F4dEMzLwkataz6Dg1GYnPbBpLK17uuE2DcD1pTXUh827turozVtVGH7vQGDNgq0TBQ0etVkhKDqiRpuELS_UrCGGmlVJTF8x58xUEto1LS3Uzt5jBBkqbBMWWP2nxJK
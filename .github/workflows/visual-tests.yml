name: Visual & Accessibility Tests

# Runs the Playwright visual-regression + accessibility suite (see frontend/tests/README.md) on
# every pull request and on every push to master. Both events run in the exact same
# compare-only mode (never --update-snapshots here) — master has a repository ruleset that
# blocks direct pushes even from Actions, so this workflow never tries to commit updated
# baselines itself. Instead, baselines are accepted BEFORE merging, from the PR itself, via the
# `/update-snapshots` comment command handled by accept-visual-baselines.yml. By the time a PR
# is merged its baselines are already correct, so this job's run on master is just a
# confirmation, not a place that ever needs to write back to the repo.
#
# Retargeted from the legacy Vite frontend/ to web/ (Next.js + Postgres) once its tests/ were
# ported over, then renamed again alongside web/ -> frontend/ once the legacy app was retired —
# see .cursor/plans/retire_frontend_and_rename_web_204713a8.plan.md. The suite needs a real
# database (its page list is generated FROM Postgres, not a static in-repo import), so this job
# has a Postgres service container + DATABASE_URL/JWT_* env + a migration step, mirroring the
# exact pattern already established in backend-web-checks.yml for the same reason.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  # Still "write", not "read": the GitHub Pages publish steps below push to the (unprotected)
  # gh-pages branch. This job never touches master/tests/visual-snapshots, only gh-pages.
  contents: write
  pull-requests: write

concurrency:
  group: visual-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # frontend/tests/e2e/generate-pages-manifest.ts and the webServer-started Next.js app both
      # need a real Postgres to read the seeded fixture content from — same ephemeral-per-run
      # container backend-web-checks.yml already uses, for the same reason (never point CI at
      # anything that persists between runs or a real dev database).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_ci
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Real env vars, not a dotenv-loaded backend/.env.test (that file is gitignored and doesn't
      # exist here) — frontend/tests/e2e/generate-pages-manifest.ts's and frontend/next.config.ts's
      # own dotenv calls are no-ops in CI for exactly this reason (dotenv's config() never
      # overwrites an already-set value). See generate-pages-manifest.ts's own comment.
      DATABASE_URL: postgresql://portfolio:portfolio_ci@localhost:5432/portfolio_test
      JWT_ACCESS_SECRET: ci-access-secret-not-for-real-use
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-real-use

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          # frontend/ and backend/ are npm workspace members (single package-lock.json at the
          # repo root) — unlike the legacy Vite frontend/ this app replaced, which had its own
          # standalone lockfile.
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (frontend/ + backend/)
        run: npm ci

      - name: Apply migrations to the CI database
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: frontend
        # Seeds portfolio_test with fixed fixtures + generates the page manifest before running
        # Playwright — see frontend/tests/README.md section 4 for why this can't happen inside a
        # spec file itself (Playwright's two-pass discovery model can't await it there).
        run: npm run test:e2e

      - name: Determine report destination path
        id: report-dest
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=reports/pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=reports/master" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/playwright-report
          destination_dir: ${{ steps.report-dest.outputs.dir }}
          keep_files: true

      # gh-pages branch root only ever gets reports/** written to it (destination_dir above) —
      # nothing publishes an index.html at the actual root, so the bare Pages URL would 404
      # forever without this (not a propagation delay, it never resolves on its own).
      - name: Generate GitHub Pages root landing page
        if: always()
        run: node .github/scripts/generate-pages-index.mjs gh-pages-root "${{ github.repository }}"

      - name: Publish landing page to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-root
          keep_files: true

      - name: Build PR comment
        if: always() && github.event_name == 'pull_request'
        run: node .github/scripts/format-summary.mjs frontend/test-results/summary.json "${{ steps.report-dest.outputs.dir }}" "${{ github.repository }}"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: frontend/pr-comment.md

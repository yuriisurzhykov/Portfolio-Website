name: Accept Visual Baselines

# Lets you comment `/update-snapshots` on a PR to accept new baseline screenshots — for when
# visual-tests.yml fails not because of a real regression, but because the PAGE'S OWN CONTENT
# changed (a new work item, a new journal post, ...). This pushes the regenerated PNGs straight
# to the PR's own branch (never to master, which has a ruleset blocking direct pushes anyway),
# which then re-triggers the normal visual-tests.yml check via `synchronize` — no manual local
# Docker run needed. See frontend/tests/README.md, section 8.
#
# Retargeted from the legacy Vite frontend/ to web/ (Next.js + Postgres), then renamed again
# alongside web/ -> frontend/ once the legacy app was retired — see
# .cursor/plans/retire_frontend_and_rename_web_204713a8.plan.md. The Postgres service +
# DATABASE_URL/JWT_* env + migration step exist because
# frontend/tests/e2e/generate-pages-manifest.ts needs a real, seeded database to build the page
# list.
#
# SECURITY (CWE-367, "Untrusted Checkout TOCTOU"): split into two jobs so `guard` can capture an
# IMMUTABLE commit SHA (via the same API call that checks the branch isn't a fork) for
# `update-snapshots` to check out — never a mutable branch ref. CodeQL still flags the checkout as
# a residual finding, dismissed as a false positive: its query only recognizes the literal
# `github.event.pull_request.head.sha` expression as "provably immutable", which can't exist for
# `issue_comment` events (no `pull_request.head` in the payload) — see dismissal note in the code
# scanning UI for the full reasoning.
on:
  issue_comment:
    types: [ created ]

jobs:
  guard:
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/update-snapshots') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # pull-requests: write, not issues: write — a comment on a PR is scoped as a
    # pull-requests resource even via the /issues/comments/... REST path.
    # issues: write 403'd here live (see frontend/tests/README.md section 11).
    permissions:
      pull-requests: write
    outputs:
      is_fork: ${{ steps.guard.outputs.is_fork }}
      head_sha: ${{ steps.guard.outputs.head_sha }}
      head_ref: ${{ steps.guard.outputs.head_ref }}
    steps:
      - name: Acknowledge the command
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: "+1",
            });

      # author_association only vets who posted the comment, not whose code is about to run — this
      # step blocks fork PRs before any of their code is checked out ("pwn request" prevention).
      # Rejection comment posted here, not in a separate job, since a job gated on `needs: guard`
      # only runs by default when guard succeeds.
      - name: Verify the PR branch is not from a fork
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const expectedFullName = `${context.repo.owner}/${context.repo.repo}`;
            const sameRepo = Boolean(pr.head.repo) && pr.head.repo.full_name === expectedFullName;
            core.setOutput("is_fork", String(!sameRepo));
            if (!sameRepo) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "🚫 `/update-snapshots` was ignored — this PR's branch isn't in this " +
                  "repository (looks like a fork). For security, this command only runs against " +
                  "same-repo PR branches: running it here would mean checking out and executing " +
                  "the fork's own code (install scripts, test config, ...) while a job still " +
                  "holds write-scoped credentials.",
              });
              core.setFailed(
                "Refusing to run: this PR's branch is not in this repository (looks like a fork). " +
                "/update-snapshots only supports same-repo PR branches, specifically to avoid " +
                "checking out and executing untrusted code while holding write-scoped credentials."
              );
              return;
            }
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("head_ref", pr.head.ref);

  update-snapshots:
    needs: guard
    if: needs.guard.outputs.is_fork != 'true'
    runs-on: ubuntu-latest
    # contents: write for the push, pull-requests: write for the comment (see
    # guard's comment above). Job-level only — GitHub Actions ignores
    # permissions: on individual steps (a reverted CodeQL autofix tried that).
    permissions:
      contents: write
      pull-requests: write

    services:
      # Same reasoning as visual-tests.yml: frontend/tests/e2e/generate-pages-manifest.ts needs a
      # real Postgres to read the seeded fixture content from before Playwright can regenerate any
      # baseline screenshots.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_ci
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Real env vars, not a dotenv-loaded backend/.env.test — see visual-tests.yml's own comment
      # for why this makes generate-pages-manifest.ts's/next.config.ts's dotenv calls no-ops here.
      DATABASE_URL: postgresql://portfolio:portfolio_ci@localhost:5432/portfolio_test
      JWT_ACCESS_SECRET: ci-access-secret-not-for-real-use
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-real-use
      # See visual-tests.yml's own comment / frontend/src/proxy.ts's DISABLE_RATE_LIMIT comment —
      # this run regenerates ALL page-level AND component-level baselines in one go, at least as
      # much traffic as the normal check, so it needs the same bypass.
      DISABLE_RATE_LIMIT: "true"
      # Must match visual-tests.yml exactly — see its own comment. Baselines regenerated against
      # the noindex variant of the site would then fail the real check.
      SEO_INDEXABLE: "true"
      SITE_URL: https://e2e.example.com

    steps:
      - name: Checkout PR head commit (immutable)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.guard.outputs.head_sha }}
          fetch-depth: 0

      - name: Prepare workspace
        uses: ./.github/actions/prepare-workspace
        with:
          node-version: "20"

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Regenerate baselines
        working-directory: frontend
        # Chains the same seed-fixtures + generate-manifest prepare steps visual-tests.yml's "Run
        # tests" step does — see frontend/tests/README.md section 4 — before re-running BOTH
        # visual.spec.ts (page-level) and component-gallery.spec.ts (component-level) with
        # --update-snapshots, so a single /update-snapshots comment accepts both suites' baselines
        # together instead of needing two separate commands.
        run: npm run test:e2e:update:all

      - name: Commit and push to the PR branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/visual-snapshots
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: accept visual regression baselines (via /update-snapshots)"
            git push origin HEAD:${{ needs.guard.outputs.head_ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment with the result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = "${{ job.status }}";
            const changed = "${{ steps.commit.outputs.changed }}";
            let body;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (outcome !== "success") {
              body = `❌ \`/update-snapshots\` failed — check the [workflow run](${runUrl}) for details.`;
            } else if (changed === "true") {
              body = "✅ Baselines updated and pushed to this PR's branch. The visual check will re-run automatically.";
            } else {
              body = "ℹ️ No baseline differences found — nothing to update. Check the [workflow run](${runUrl}) for details.";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

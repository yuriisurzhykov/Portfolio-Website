name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Dependabot update metadata]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Privileged jobs load automation only from the default branch.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: dependency-update
          path: dependency-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the PR and metadata again
        id: update
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/read-dependency-update.cjs')({ github, context, core });

      - name: Wait for every CI check on the current PR commit
        id: ci
        if: >-
          steps.update.outputs.type == 'version-update:semver-patch' ||
          steps.update.outputs.type == 'version-update:semver-minor'
        env:
          PR_NUMBER: ${{ steps.update.outputs.number }}
          PR_SHA: ${{ steps.update.outputs.sha }}
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/wait-for-dependency-ci.cjs')({ github, context, core });

      - name: Merge the verified patch or minor update
        if: steps.ci.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.update.outputs.number }}
          PR_SHA: ${{ steps.update.outputs.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Configure repository secret DEPENDENCY_UPDATE_TOKEN (fine-grained PAT) so merges trigger master CI and deployment.'
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$PR_SHA"

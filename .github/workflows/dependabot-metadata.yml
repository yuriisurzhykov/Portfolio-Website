name: Dependabot update metadata

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record the verified update
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          node -e 'require("fs").writeFileSync("dependency-update.json", JSON.stringify({number: Number(process.env.PR_NUMBER), sha: process.env.PR_SHA, type: process.env.UPDATE_TYPE}))'

      - name: Upload metadata for the trusted privileged workflows
        uses: actions/upload-artifact@v4
        with:
          name: dependency-update
          path: dependency-update.json
          retention-days: 1

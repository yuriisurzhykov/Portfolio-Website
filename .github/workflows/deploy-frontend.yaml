name: Deploy frontend/ (Next.js)

# push to master  -> deploy to dev.yuriisoft.me  (yuriisoft-frontend-dev.service, :3001)
# push tag v*     -> deploy to yuriisoft.me      (yuriisoft-frontend.service, :3000)
#
# Mirrors deploy_release.yaml's tag-triggered production model (same VPS
# secrets, same appleboy actions) but adds a continuous dev deploy on every
# master push, and adds the extra steps deploy.sh never needed for a
# static site: wiring backend/.env into the release and running
# `prisma migrate deploy` before restarting the app (see deploy-frontend.sh).
#
# Renamed from deploy-web.yaml when web/ was renamed to frontend/ (the
# legacy Vite frontend/ this app replaced was retired first — see
# .cursor/plans/retire_frontend_and_rename_web_204713a8.plan.md). The VPS
# targets below (yuriisoft-frontend[-dev], /srv/apps/yuriisoft-frontend[-dev])
# name the NEW infrastructure this workflow deploys to once provisioned —
# CI is retargeted first, then the actual systemd services/directories are
# provisioned under the new names before this workflow is exercised for
# real again.
#
# Supersedes build-web-artifact.yml (a manual, deploy-less diagnostic
# workflow used to get the very first artifact onto the VPS during initial
# Phase 6 bring-up) — that file is removed in the same commit as this one.

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # See build-web-artifact.yml's original comment: `prisma generate`
    # (backend's postinstall script) needs DATABASE_URL to be *set*, even
    # though it never connects — these are build-time placeholders only.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      JWT_ACCESS_SECRET: build-time-placeholder-not-for-real-use
      JWT_REFRESH_SECRET: build-time-placeholder-not-for-real-use

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (frontend/ + backend/)
        run: npm ci

      - name: Build frontend (Next.js)
        working-directory: frontend
        run: npm run build

      - name: Package artifact
        run: |
          tar \
            --exclude='.git' \
            --exclude='frontend/.next/cache' \
            -czf release.tar.gz \
            package.json package-lock.json node_modules backend frontend

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-release
          path: release.tar.gz
          retention-days: 7

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment-name: dev
      base-dir: /srv/apps/yuriisoft-frontend-dev
      service-name: yuriisoft-frontend-dev.service
      deploy-tag: ${{ github.sha }}
      # An explicit "false", not an omitted variable: site-url.ts treats
      # anything other than the exact string "true" as noindex either way,
      # but writing it down says this is a decision, not an oversight.
      seo-indexable: "false"
      # Set even though this target is noindex — without it `metadataBase`
      # falls back to localhost and every canonical/OG URL rendered on dev
      # becomes meaningless, which makes dev useless for checking them.
      site-url: https://dev.yuriisoft.me
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PLANTUML_SERVER_URL: ${{ secrets.PLANTUML_SERVER_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL_DEV }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN_DEV }}

  # Publishes a GitHub Release for the pushed tag with auto-generated
  # notes (from merged PRs/commits since the last tag) and the exact
  # built artifact attached — a permanent, browsable record of "what was
  # v1.2.3, and can I get that exact build back later" independent of the
  # VPS deploy (this job doesn't depend on deploy-prod, and deploy-prod
  # doesn't depend on this — a slow/failed release publish should never
  # block the actual deploy, and vice versa).
  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-release

      - name: Rename artifact for clarity
        run: mv release.tar.gz "frontend-${{ github.ref_name }}.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: "frontend-${{ github.ref_name }}.tar.gz"

  deploy-prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment-name: prod
      base-dir: /srv/apps/yuriisoft-frontend
      service-name: yuriisoft-frontend.service
      # github.ref_name IS the tag name for a tag push (v1.2.3) — no separate
      # "read version from tag" step needed, it was just re-deriving this.
      deploy-tag: ${{ github.ref_name }}
      # THE one environment that gets indexed. Deploy publishes this to
      # shared/.env before starting the new release, so it can no longer be
      # forgotten — which matters because forgetting it is not a small
      # mistake: indexing is opt-in, so an absent variable means the whole
      # site serves `noindex` and Google starts dropping pages.
      seo-indexable: "true"
      site-url: https://yuriisoft.me
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PLANTUML_SERVER_URL: ${{ secrets.PLANTUML_SERVER_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL_PROD }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN_PROD }}

name: Backend & Web Checks

# Runs on every pull request and every push to master: backend typecheck, the Vitest suite in
# backend/ (against an ephemeral Postgres service container), and a full `next build` of
# frontend/. Equivalent of visual-tests.yml for the Next.js/Postgres/Prisma side of the repo.

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: backend-web-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_ci
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A real Postgres service container per run, not the dotenv-loaded
      # backend/.env.test used locally (that file is gitignored and
      # intentionally does not exist here) — these are already real
      # environment variables, so backend/vitest.setup.ts's dotenv call is a
      # no-op (it never overwrites an already-set variable) and
      # frontend/next.config.ts's dotenv call is too (same reason), which is
      # exactly the point of both being written that way.
      DATABASE_URL: postgresql://portfolio:portfolio_ci@localhost:5432/portfolio_test
      JWT_ACCESS_SECRET: ci-access-secret-not-for-real-use
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-real-use

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare workspace
        uses: ./.github/actions/prepare-workspace
        with:
          # Current Node 24 includes the npm workspace-override fix and
          # meets jsdom's Node >=24.15 requirement.
          node-version: "24"

      # npm audit reads the single workspace lockfile, including dev and optional packages.
      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Run backend test suite
        working-directory: backend
        run: npx vitest run

      - name: Run backend mutation tests
        working-directory: backend
        run: npm run test:mutation

      - name: Typecheck design-tokens engine
        working-directory: packages/design-tokens
        run: npm run typecheck

      - name: Run design-tokens engine test suite
        working-directory: packages/design-tokens
        run: npx vitest run

      - name: Run design-tokens engine mutation tests
        working-directory: packages/design-tokens
        run: npm run test:mutation

      - name: Lint frontend styles (Stylelint)
        working-directory: frontend
        run: npm run lint:css

      # Its own script/step, deliberately not folded into a general `npm run
      # lint` — `eslint-config-next` is pinned to a stale, effectively-unrelated
      # package here (see frontend/eslint.tokens.config.mjs's own comment),
      # a separate pre-existing issue this refactor doesn't take on. This
      # rule set has a clean, zero-baseline history and is meant to actually
      # block a PR, not ride along inside a step with a 56-error backlog.
      - name: Lint design tokens (no raw colors outside primitives)
        working-directory: frontend
        run: npm run lint:tokens

      # Compares generated files with compiler output without rewriting them.
      - name: Verify design tokens are up to date
        working-directory: frontend
        run: npm run tokens:check

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test

      - name: Run frontend mutation tests
        working-directory: frontend
        run: npm run test:mutation

      - name: Build frontend (Next.js)
        working-directory: frontend
        run: npm run build

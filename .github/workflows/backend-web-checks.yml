name: Backend & Web Checks

# Runs on every pull request and every push to master: backend typecheck, the Vitest suite in
# backend/ (against an ephemeral Postgres service container), and a full `next build` of
# frontend/. Equivalent of visual-tests.yml for the Next.js/Postgres/Prisma side of the repo.

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: backend-web-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_ci
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A real Postgres service container per run, not the dotenv-loaded
      # backend/.env.test used locally (that file is gitignored and
      # intentionally does not exist here) — these are already real
      # environment variables, so backend/vitest.setup.ts's dotenv call is a
      # no-op (it never overwrites an already-set variable) and
      # frontend/next.config.ts's dotenv call is too (same reason), which is
      # exactly the point of both being written that way.
      DATABASE_URL: postgresql://portfolio:portfolio_ci@localhost:5432/portfolio_test
      JWT_ACCESS_SECRET: ci-access-secret-not-for-real-use
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-real-use

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare workspace
        uses: ./.github/actions/prepare-workspace
        with:
          # 22, not 20 like the other workflows in this repo: StrykerJS's
          # @stryker-mutator/vitest-runner (mutation testing, see
          # test:mutation below) requires Node >=22. Scoped to this workflow
          # only — it's the one that runs the suites Stryker reruns.
          node-version: "22"

      # Repo-root, not per-workspace: one lockfile (package-lock.json) covers
      # frontend/ + backend/ together, and npm audit reads the whole
      # resolved tree from there regardless of which workspace a dependency
      # belongs to. Added during the OWASP audit remediation, after running
      # `npm audit fix` for real against a real baseline (7 findings: 4
      # high — brace-expansion, postcss/sharp via next — and 3 moderate —
      # mermaid, qs via Stryker's own typed-rest-client) — all 4 high ones
      # had a non-breaking fix available and were resolved (confirmed:
      # backend + frontend test suites and `next build` all still pass
      # unchanged); only the 2 remaining moderate `qs` findings (a
      # dev-only mutation-testing tool's own transitive dependency, never
      # reachable from this app's own runtime) had no fix yet.
      # --audit-level=high is set to match that real baseline, not guessed
      # — moderate/low findings don't block a PR, high/critical ones do.
      - name: Audit dependencies for high/critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Run backend test suite
        working-directory: backend
        run: npx vitest run

      - name: Run backend mutation tests
        working-directory: backend
        run: npm run test:mutation

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test

      - name: Run frontend mutation tests
        working-directory: frontend
        run: npm run test:mutation

      - name: Build frontend (Next.js)
        working-directory: frontend
        run: npm run build

name: Backend & Web Checks

# Runs on every pull request and every push to master: backend typecheck, the Vitest suite in
# backend/ (against an ephemeral Postgres service container), and a full `next build` of
# frontend/. Equivalent of visual-tests.yml for the Next.js/Postgres/Prisma side of the repo.

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: backend-web-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_ci
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A real Postgres service container per run, not the dotenv-loaded
      # backend/.env.test used locally (that file is gitignored and
      # intentionally does not exist here) — these are already real
      # environment variables, so backend/vitest.setup.ts's dotenv call is a
      # no-op (it never overwrites an already-set variable) and
      # frontend/next.config.ts's dotenv call is too (same reason), which is
      # exactly the point of both being written that way.
      DATABASE_URL: postgresql://portfolio:portfolio_ci@localhost:5432/portfolio_test
      JWT_ACCESS_SECRET: ci-access-secret-not-for-real-use
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-real-use

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20 like the other workflows in this repo: StrykerJS's
          # @stryker-mutator/vitest-runner (mutation testing, see
          # test:mutation below) requires Node >=22. Scoped to this workflow
          # only — it's the one that runs the suites Stryker reruns.
          node-version: 22
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies (frontend/ + backend/)
        run: npm ci

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Apply migrations to the CI database
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run backend test suite
        working-directory: backend
        run: npx vitest run

      - name: Run backend mutation tests
        working-directory: backend
        run: npm run test:mutation

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test

      - name: Run frontend mutation tests
        working-directory: frontend
        run: npm run test:mutation

      - name: Build frontend (Next.js)
        working-directory: frontend
        run: npm run build
